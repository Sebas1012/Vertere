apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cenitops
  namespace: default
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cenitops.sebas1012.site
      secretName: cloudflare-origin-cert
  rules:
    - host: cenitops.sebas1012.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertere-web
                port:
                  number: 80
