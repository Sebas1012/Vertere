apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertere-web
  labels:
    app: vertere-web
spec:
  selector:
    matchLabels:
      app: vertere-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vertere-web
    spec:
      containers:
        - name: web
          image: ghcr.io/sebas1012/vertere-web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
