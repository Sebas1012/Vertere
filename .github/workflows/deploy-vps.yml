name: deploy-on-vps-cluster
on:
  workflow_dispatch:
  # Temporal: workflow_dispatch solo aparece en la pestana Actions si el workflow
  # existe en la rama por defecto. Hasta que esto entre en main, `push` permite
  # dispararlo desde aqui.
  # QUITAR al mergear: si no, cada push a la rama despliega a produccion.
  push:
    branches: [main]

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: vertere-web
            context: ./
    steps:
      - uses: actions/checkout@v4

      - name: Get Image Name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar manifiestos al VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: k8s/
          target: ~/vertere
          overwrite: true

      - name: Aplicar en microk8s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA,OWNER
          script: |
            set -e
            export PATH="$PATH:/snap/bin"
            OWNER=$(echo "$OWNER" | tr "A-Z" "a-z")   # ghcr solo acepta minusculas
            microk8s kubectl -n production apply -R -f "$HOME/vertere/k8s"
            microk8s kubectl -n production set image deploy/vertere-web web=ghcr.io/$OWNER/vertere-web:$SHA
            microk8s kubectl -n production rollout status deploy/vertere-web --timeout=180s
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
